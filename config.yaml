# ==============================================================================
# JARVIS — Configuration File
# ==============================================================================

system:
  name: "JARVIS"
  version: "0.1.0"
  environment: "development"
  mode: "terminal"
  debug: false

personality:
  name: "JARVIS"
  mode: "normal" # Options: normal, coding, study, research, professional, emergency
  humor: 0.6
  sarcasm: 0.4
  formality: 0.7
  warmth: 0.6
  verbosity: 0.4
  confidence: 0.8
  proactivity: 0.5
  preferred_address: "sir"
  response_style: "concise"

model:
  provider: "mock" # Options: "mock", "ollama"
  model_name: "llama3.2"
  base_url: "http://localhost:11434"
  temperature: 0.7
  timeout_seconds: 30.0
  max_context_messages: 20
  fallback_to_mock: true

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] [%(name)s]: %(message)s"
  console: true
  file_logging: true
  log_file: "data/logs/jarvis.log"
  max_bytes: 10485760 # 10 MB
  backup_count: 5

paths:
  data_dir: "data"
  logs_dir: "data/logs"
  memory_dir: "data/memory"
  documents_dir: "data/documents"

voice:
  enabled: false
  mode: "wake_word" # Options: "text", "push_to_talk", "wake_word"
  sample_rate: 16000
  channels: 1
  chunk_duration_ms: 30
  audio:
    input_device: null
    output_device: null
  stt:
    provider: "faster-whisper" # Options: "faster-whisper", "mock"
    model: "tiny.en"
    device: "cpu" # "cpu", "cuda", "auto"
    compute_type: "int8"
    fallback_to_mock: true
  tts:
    provider: "sapi5" # Options: "sapi5", "mock"
    voice: "Microsoft David Desktop"
    speed: 1.0
    fallback_to_mock: true
  vad:
    enabled: true
    provider: "energy" # Options: "energy", "mock"
    threshold: 0.02
    silence_duration_ms: 800
  wake_word:
    provider: "keyword" # Options: "keyword", "mock"
    phrase: "jarvis"
    threshold: 0.5

